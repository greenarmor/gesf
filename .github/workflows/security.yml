name: Semgrep SAST

# Supplementary SAST scanning with native GitHub integration.
# GESF Security Gate (ges-gate.yml) is the supreme authority.

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
