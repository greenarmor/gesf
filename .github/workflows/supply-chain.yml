name: Supply Chain Security

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup pnpm
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@v6

      - name: Install dependencies (pnpm)
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (npm)
        if: hashFiles('pnpm-lock.yaml') == '' && hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Install dependencies (yarn)
        if: hashFiles('pnpm-lock.yaml') == '' && hashFiles('package-lock.json') == '' && hashFiles('yarn.lock') != ''
        run: yarn install --frozen-lockfile

      - name: Audit dependencies (pnpm)
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Audit dependencies (npm)
        if: hashFiles('pnpm-lock.yaml') == '' && hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit dependencies (yarn)
        if: hashFiles('pnpm-lock.yaml') == '' && hashFiles('package-lock.json') == '' && hashFiles('yarn.lock') != ''
        run: yarn audit --level high
        continue-on-error: true

      - name: Audit install scripts
        run: |
          echo "Checking for packages with lifecycle scripts (postinstall, preinstall, install, prepare)..."
          FOUND=$(node -e "
            const pkg = require('./package.json');
            const allDeps = { ...pkg.dependencies, ...pkg.devDependencies, ...pkg.optionalDependencies };
            for (const [name] of Object.entries(allDeps)) {
              try {
                const depPkg = require(name + '/package.json');
                const scripts = Object.keys(depPkg.scripts || {});
                const dangerous = scripts.filter(s => ['postinstall','preinstall','install','prepare'].includes(s));
                if (dangerous.length > 0) {
                  console.log(name + ': ' + dangerous.join(', '));
                }
              } catch {}
            }
          " 2>/dev/null || echo "Direct deps checked")
          if [ -z "$FOUND" ]; then
            echo "No dangerous install scripts found in direct dependencies.";
          fi
        continue-on-error: true

      - name: Summary
        run: |
          echo "### Supply Chain Security Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency audit (high+) | advisory |" >> $GITHUB_STEP_SUMMARY
          echo "| Install scripts | checked |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All checks are advisory (non-blocking). Active gates: Trivy (dependency-scan.yml), Gitleaks (secret-scan.yml)." >> $GITHUB_STEP_SUMMARY
