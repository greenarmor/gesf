name: Compliance Gate

# ═══════════════════════════════════════════════════════════════
# GESF Compliance Gate — GESF's SUPREME authority.
# Runs 9 built-in scanners via ges audit --ci.
# ═══════════════════════════════════════════════════════════════

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  pull-requests: read

jobs:
  compliance:
    name: GESF Compliance Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GESF
        run: npm install -g @greenarmor/ges

      - name: Initialize GESF
        run: ges init --name "GESF" --type "generic-web-application" --frameworks "GDPR,OWASP,CIS,NIST" --country "US-CA" --force

      - name: Run Compliance Audit
        run: ges audit --ci

      - name: Generate Compliance Score
        run: ges score --ci

      - name: Upload Compliance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: reports/
