name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            asset-name: ges-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            asset-name: ges-darwin-arm64
          - os: macos-13
            target: bun-darwin-x64
            asset-name: ges-darwin-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r run build

      - name: Get version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./packages/cli/package.json').version)")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Inject version into source
        run: |
          V="${{ steps.version.outputs.version }}"
          # Replace CLI version.ts with hardcoded exports (no require/import)
          cp packages/cli/src/utils/version.ts packages/cli/src/utils/version.ts.bak
          echo "export const CLI_VERSION = \"${V}\";" > packages/cli/src/utils/version.ts
          echo "export const AUTHOR = \"greenarmor\";" >> packages/cli/src/utils/version.ts
          echo "export const RELEASE_DATE = \"2026-06-20\";" >> packages/cli/src/utils/version.ts
          echo "export const DONATE_URL = \"https://ko-fi.com/greenarmor\";" >> packages/cli/src/utils/version.ts
          echo "export const HOMEPAGE = \"https://github.com/greenarmor/gesf\";" >> packages/cli/src/utils/version.ts
          # Replace core GESF_VERSION with hardcoded value (avoids require("../../package.json"))
          cp packages/core/src/constants/index.ts packages/core/src/constants/index.ts.bak
          perl -pi -e "s|export const GESF_VERSION: string = pkg\.version;|export const GESF_VERSION: string = \"${V}\";|" packages/core/src/constants/index.ts

      - name: Compile standalone binary
        run: |
          bun build --compile \
            --target=${{ matrix.target }} \
            packages/cli/src/cli.ts \
            --outfile ${{ matrix.asset-name }}

      - name: Restore source files
        if: always()
        run: |
          mv packages/cli/src/utils/version.ts.bak packages/cli/src/utils/version.ts
          mv packages/core/src/constants/index.ts.bak packages/core/src/constants/index.ts

      - name: Test binary
        run: ./${{ matrix.asset-name }} --version

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset-name }}

  build-deb:
    name: Build .deb package (linux-x64)
    runs-on: ubuntu-latest
    needs: [build-binaries]

    steps:
      - uses: actions/checkout@v5

      - name: Download linux-x64 binary
        uses: actions/download-artifact@v4
        with:
          name: ges-linux-x64

      - name: Build .deb package
        uses: goreleaser/nfpm@v2
        with:
          config: .brew/nfpm.yaml
          target: ges_${{ github.ref_name }}_amd64.deb

      - name: Upload .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: ges_${{ github.ref_name }}_amd64.deb

  update-formula:
    name: Update Homebrew formula SHA256s
    runs-on: ubuntu-latest
    needs: [build-binaries]

    steps:
      - uses: actions/checkout@v5

      - name: Download all binaries
        uses: actions/download-artifact@v4

      - name: Compute SHA256s
        id: shas
        run: |
          echo "darwin-arm64=$(shasum -a 256 ges-darwin-arm64/ges-darwin-arm64 | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "darwin-x64=$(shasum -a 256 ges-darwin-x64/ges-darwin-x64 | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "linux-x64=$(shasum -a 256 ges-linux-x64/ges-linux-x64 | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Print SHA256s (copy to homebrew-gesf formula)
        run: |
          echo "=== Copy these to greenarmor/homebrew-gesf Formula/ges.rb ==="
          echo "darwin-arm64: ${{ steps.shas.outputs.darwin-arm64 }}"
          echo "darwin-x64:   ${{ steps.shas.outputs.darwin-x64 }}"
          echo "linux-x64:    ${{ steps.shas.outputs.linux-x64 }}"
