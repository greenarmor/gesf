name: Secret Gate (Gitleaks)

# Scans full git history for leaked secrets.
# Gate behavior: exits non-zero on any secret detected.

on:
  push:
  pull_request:

jobs:
  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
