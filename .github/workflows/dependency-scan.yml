name: Dependency Gate (Trivy)

# Trivy filesystem scan + npm audit for known CVEs.
# Gate behavior: exits non-zero on CRITICAL/HIGH.

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'

jobs:
  dependency-scan:
    name: Trivy + npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
